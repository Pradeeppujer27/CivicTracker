# ==============================================================
# CivicTrack - Render Blueprint Infrastructure as Code (render.yaml)
# Deploys: Backend Web Service + Managed Persistent Disk + Frontend Static Site
# ==============================================================

services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: civictrack-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/departments
    disk:
      name: civictrack-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # 2. Frontend Static Site
  - type: static
    name: civictrack-frontend
    buildCommand: "echo 'Frontend ready'"
    staticPublishPath: ./frontend
    routes:
      - type: rewrite
        source: /api/v1/*
        destination: https://civictrack-backend.onrender.com/api/v1/*
      - type: rewrite
        source: /uploads/*
        destination: https://civictrack-backend.onrender.com/uploads/*
