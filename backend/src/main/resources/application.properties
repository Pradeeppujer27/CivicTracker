# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/civictrack?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Pradeeppujer@27022007}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:9a67c4e5d2b1f8a3c7e6d5b4a3f2e1d09a67c4e5d2b1f8a3c7e6d5b4a3f2e1d0}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Persistent File Upload Configuration
