app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://127.0.0.1:8080,http://localhost:8080,https://*.vercel.app,https://*.netlify.app,https://*.onrender.com,https://*.up.railway.app,*}
