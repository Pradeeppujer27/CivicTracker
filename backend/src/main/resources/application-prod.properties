# ==============================================================
# CivicTrack Production Profile Application Properties
# Activated via: -Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# ==============================================================

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api/v1

# Production Managed MySQL Configuration (Render / Railway / Aiven / PlanetScale / AWS RDS)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Production Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# High Security JWT Key (Must be set via environment variable)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Persistent Production Disk / Storage Directory
app.upload.dir=${UPLOAD_DIR:/var/data/uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Production CORS Headers
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.vercel.app,https://*.netlify.app,https://*.onrender.com,https://*.up.railway.app}
